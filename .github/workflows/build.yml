name: Build releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to create
        default: blur-1

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        target: [cpu, gpu-cuda11.8, gpu-cuda12.9]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 7-Zip (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Install Python packages
        run: |
          # The CLI and auto_blur do not use the GUI packages, so those are left out
          python -c "import tomllib; print('\n'.join(d for d in tomllib.load(open('pyproject.toml','rb'))['project']['dependencies'] if not d.startswith(('PySimpleGUI','psgdnd','PyTaskbar','winotify','plyer'))))" > requirements.txt
          python -m pip install -r requirements.txt nuitka requests
          if [ "$RUNNER_OS" = "Linux" ]; then python -m pip install patchelf; fi

      - name: Build
        run: python build.py --cli-only true --target ${{ matrix.target }} --archive true --release-type blur

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.target }}
          path: Releases/*.7z*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" files/* --repo "${{ github.repository }}" --draft --title "${{ inputs.tag }}" --notes "Quick hack, builds are untested."
